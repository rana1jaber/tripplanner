<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TripPlanner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script>
    // Apply the saved (or system) theme before the page paints, so there is no white flash
    try {
      var th = localStorage.getItem('theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.dataset.theme = th;
    } catch (e) {}
  </script>
</head>
<body>

  <!-- ===== Top bar ===== -->
  <header class="topbar">
    <a href="#" class="logo" id="logo">
      <svg viewBox="0 0 32 20" width="30" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"><path d="M2 18 11 6l6 8 4-5 9 9Z"/></svg>
      TripPlanner
    </a>
    <nav class="nav">
      <a href="#" data-nav="home" class="active" data-i18n="nav_home"></a>
      <a href="#" data-nav="trips" data-i18n="nav_trips"></a>
    </nav>
    <button class="theme-btn" id="themeBtn"></button>
    <button class="lang-btn" id="langBtn"></button>
    <div class="avatar" id="avatar">?</div>
  </header>

  <!-- ===== Home ===== -->
  <section id="home" class="view">
    <div class="hero">
      <div class="hero-text">
        <h1 data-i18n-html="hero_title"></h1>
        <p data-i18n="hero_sub"></p>
        <div class="join-box">
          <span class="join-ico">🔗</span>
          <input id="joinInput" data-i18n-ph="join_ph">
          <button class="btn" id="joinBtn" data-i18n="join_btn"></button>
        </div>
        <button class="btn btn-light" id="newTripBtn" data-i18n="new_trip"></button>
      </div>
      <div class="hero-art">
        <div class="post p1"><span>🏖️</span><b data-i18n="hero_p1"></b></div>
        <div class="post p2"><span>🏙️</span><b data-i18n="hero_p2"></b></div>
        <div class="post p3"><span>🏜️</span><b data-i18n="hero_p3"></b></div>
      </div>
    </div>

    <div class="features">
      <div class="feature"><div class="f-ico">📅</div><h3 data-i18n="f1_t"></h3><p data-i18n="f1_p"></p></div>
      <div class="feature"><div class="f-ico">👥</div><h3 data-i18n="f2_t"></h3><p data-i18n="f2_p"></p></div>
      <div class="feature"><div class="f-ico">🗳️</div><h3 data-i18n="f3_t"></h3><p data-i18n="f3_p"></p></div>
      <div class="feature"><div class="f-ico">🗺️</div><h3 data-i18n="f4_t"></h3><p data-i18n="f4_p"></p></div>
    </div>
  </section>

  <!-- ===== Trip wizard ===== -->
  <section id="wizard" class="view" hidden>
    <aside class="steps" id="steps"></aside>
    <main class="step-content" id="stepContent"></main>
  </section>

  <!-- ===== Modal & toast ===== -->
  <div class="modal" id="modal" hidden>
    <div class="modal-box">
      <button class="modal-x" id="modalX" aria-label="Close">✕</button>
      <div id="modalBody"></div>
    </div>
  </div>
  <div class="toast" id="toast"></div>

  <script src="script.js"></script>
</body>
</html>
